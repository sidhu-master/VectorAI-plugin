# DXF工程数据文档
# 编码：UTF-8；长度单位：mm；角度单位：deg
# 用途：为 initial.dxf 提供智能分区所需的工程语义。
# 本文档只填写能够由当前设计和DXF几何确认的重要功能区域。
# 常规轴段、内孔台阶及过渡段由系统从DXF自动识别，不在本文档中重复填写。
# 空白参数表示当前未定义，AI不得猜测或补全。

[drawing]
drawing_id=external-golden-001
drawing_name=initial.dxf
unit=mm
# 轴向坐标从左端面起算，向右为正。
axis_origin=left_end
orientation=forward

