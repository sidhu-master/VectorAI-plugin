# VectorAI 2D Space for the DSH Web profile. The Host owns tools and Drawing
# state; the Client row is discovered by dsh-client-modules through dsh.client.
- insert:
    - id: vectorai-space-host
      name: '@vectorai/plugin-dsh-space-host'

    - id: vectorai-space-client
      name: '@vectorai/plugin-dsh-space-client'

    - id: vectorai-engineering-annotation
      name: '@vectorai/plugin-dsh-annotation'

    - id: vectorai-engineering-annotation-client
      name: '@vectorai/plugin-dsh-annotation-client'
